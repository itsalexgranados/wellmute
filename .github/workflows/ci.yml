name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Only platform-tools: the action's default also asks for the old "tools" package,
      # which no longer exists and makes sdkmanager fail. Gradle downloads the rest.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      # `check` runs the unit tests, lint and the INTERNET check.
      - name: Build, test, lint and check there is no INTERNET permission
        run: ./gradlew --no-daemon assembleDebug assembleRelease check

      - name: Double-check the release APK with aapt2
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if "$AAPT2" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::The release APK declares android.permission.INTERNET"
            exit 1
          fi
          echo "OK: no INTERNET permission in $APK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports/
